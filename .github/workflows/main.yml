name: Build & Publish Free APK
on:
  push:
    branches: [ main, master ]
  workflow_dispatch:
permissions:
  contents: write
jobs:
  build-apk:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "21"
      - run: yes | "$ANDROID_HOME/cmdline-tools/latest/bin/sdkmanager" --licenses >/dev/null || true
      - run: |
          if [ -f debug.keystore.base64 ]; then
            base64 -d debug.keystore.base64 > debug.keystore
          fi
      - uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: "9.3.1"
      - run: gradle :app:assembleDebug --no-daemon
      - run: cp app/build/outputs/apk/debug/app-debug.apk Al-Anhar-Journal.apk
      - uses: softprops/action-gh-release@v2
        with:
          tag_name: latest
          name: Al-Anhar Journal — أحدث نسخة APK
          files: Al-Anhar-Journal.apk
          make_latest: true
